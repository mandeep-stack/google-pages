<!-- Google Ads tag. Replace AW-319782139 with your real Google Ads tag ID. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-319782139"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'AW-319782139');
</script>

<!-- THE ONE CONVERSION. Fires once per payment, for both /speed (src=speed) and
     /pixel (src=pixel). Replace YOUR_LABEL with the label of the conversion action. -->
<script>
(function(){
  var SEND_TO = 'AW-319782139/UpmeCNG0r7YdEPv5vZgB';
  var VALUES  = { speed: 199, pixel: 99 };   // INR, matches each offer's price

  var p   = new URLSearchParams(location.search);
  var src = p.get('src');
  if (!Object.prototype.hasOwnProperty.call(VALUES, src)) return;   // direct visit: no conversion

  // speed passes pid; Razorpay pages may append razorpay_payment_id for pixel
  var pid = p.get('pid') || p.get('razorpay_payment_id') || '';
  if (src === 'speed' && !pid) return;   // speed always has a payment id after a real payment
  var txn = pid || ('pixel-' + Date.now());

  // Fire once per payment even if the page is reloaded or reopened
  var key = 'gads_conv_' + (pid || src);
  try { if (localStorage.getItem(key)) return; localStorage.setItem(key, '1'); } catch(e) {}

  gtag('event', 'conversion', {
    send_to: SEND_TO,
    value: VALUES[src],
    currency: 'INR',
    transaction_id: txn
  });
})();
</script>
